<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="般若阁 - 佛经阅读">
  <title>般若阁 - 诵经</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="scriptures.html" style="color:var(--text-secondary);font-size:1.2rem;text-decoration:none;">&larr;</a>
      <span class="logo" id="detail-title">佛经</span>
      <div class="header-actions">
        <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">🌙</button>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- 控制栏 -->
    <div class="scripture-controls">
      <div class="control-group">
        <span style="font-size:0.75rem;color:var(--text-muted);padding:0 8px;">字号</span>
        <button class="control-btn font-size-btn active" data-size="small">小</button>
        <button class="control-btn font-size-btn" data-size="normal">中</button>
        <button class="control-btn font-size-btn" data-size="large">大</button>
        <button class="control-btn font-size-btn" data-size="xlarge">超大</button>
      </div>
    </div>

    <!-- 经文内容 -->
    <div class="scripture-content" id="scripture-text">
      加载中...
    </div>

    <!-- 经文信息 -->
    <p id="scripture-meta" style="text-align:center;font-size:0.8rem;color:var(--text-muted);margin-top:16px;"></p>

    <div class="disclaimer">
      本网站仅为佛教文化学习与修行辅助工具，不涉及任何商业行为。<br>
      佛经内容来源于乾隆大藏经等公共版权版本。
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html">
      <span class="nav-icon">🐟</span>木鱼
    </a>
    <a href="scriptures.html" class="active">
      <span class="nav-icon">📖</span>佛经
    </a>
    <a href="profile.html">
      <span class="nav-icon">👤</span>我的
    </a>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 获取经文 ID
      const params = new URLSearchParams(location.search);
      const id = params.get('id');

      const scripture = SCRIPTURES.find(s => s.id === id);

      if (scripture) {
        document.title = '般若阁 - ' + scripture.shortTitle;
        document.getElementById('detail-title').textContent = scripture.shortTitle;
        document.getElementById('scripture-text').textContent = scripture.text;
        document.getElementById('scripture-meta').textContent = scripture.author;
      } else {
        document.getElementById('scripture-text').innerHTML = `
          <p style="text-align:center;color:var(--text-muted);padding:40px 0;">
            经文未找到。<br><br>
            <a href="scriptures.html">返回佛经列表</a>
          </p>`;
      }
    });
  </script>
</body>
</html>
