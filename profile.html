<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="般若阁 - 个人中心">
  <title>般若阁 - 我的</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">般若阁</a>
      <div class="header-actions">
        <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">🌙</button>
      </div>
    </div>
  </header>

  <main class="main">
    <h1 class="page-title">我的修行</h1>
    <p class="page-subtitle" id="profile-subtitle">登录以同步功德数据</p>

    <!-- 已登录：用户信息 -->
    <div class="profile-section" id="profile-logged-in" style="display:none;">
      <div class="card" style="text-align:center;">
        <div class="avatar" id="profile-avatar">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <h2 id="profile-username" style="font-family:var(--font-serif);font-size:1.3rem;margin-bottom:4px;">行者</h2>
        <p id="profile-email" style="font-size:0.85rem;color:var(--text-secondary);">---</p>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="profile-knocks">0</div>
            <div class="stat-label">累计功德</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="profile-local-knocks">0</div>
            <div class="stat-label">本机计数</div>
          </div>
        </div>

        <button class="btn btn-secondary btn-block" onclick="handleLogout()" style="margin-top:16px;">
          退出登录
        </button>
      </div>
    </div>

    <!-- 未登录：登录引导 -->
    <div class="profile-section" id="profile-logged-out">
      <div class="card" style="text-align:center;">
        <div class="avatar">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <h2 style="font-family:var(--font-serif);font-size:1.2rem;margin-bottom:8px;">未登录</h2>
        <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px;">
          登录后可同步功德数据，多设备共享修行记录。
        </p>
        <p style="font-size:0.75rem;color:var(--text-muted);margin-bottom:20px;">
          当前本机功德数：<strong id="local-knocks-display">0</strong>
        </p>

        <button class="btn btn-primary btn-block" onclick="showAuthModal('login')" style="margin-bottom:10px;">
          邮箱登录 / 注册
        </button>
        <button class="btn btn-github btn-block" onclick="handleGitHubLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          GitHub 登录
        </button>

        <p style="font-size:0.7rem;color:var(--text-muted);margin-top:16px;">
          注册即表示您同意本网站仅用于佛教文化学习目的
        </p>
      </div>
    </div>

    <div class="disclaimer">
      本网站仅为佛教文化学习与修行辅助工具，不涉及任何商业行为。<br>
      所有外部链接均添加 rel="noopener noreferrer" 安全属性。
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html">
      <span class="nav-icon">🐟</span>木鱼
    </a>
    <a href="scriptures.html">
      <span class="nav-icon">📖</span>佛经
    </a>
    <a href="profile.html" class="active">
      <span class="nav-icon">👤</span>我的
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/wooden-fish.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 初始化本地计数显示
    document.addEventListener('DOMContentLoaded', async () => {
      initKnockCounter();

      // 显示本地计数
      const localEl = document.getElementById('local-knocks-display');
      if (localEl) {
        localEl.textContent = getKnockCount().toLocaleString('zh-CN');
      }

      // 检查登录状态
      try {
        const user = await getCurrentUser();
        if (user) {
          document.getElementById('profile-logged-out').style.display = 'none';
          document.getElementById('profile-logged-in').style.display = 'block';
          document.getElementById('profile-subtitle').textContent = '修行精进，福慧双修';

          // 头像
          const avatarEl = document.getElementById('profile-avatar');
          const avatarUrl = user.user_metadata?.avatar_url;
          if (avatarUrl) {
            avatarEl.innerHTML = `<img src="${avatarUrl}" alt="avatar" referrerpolicy="no-referrer" rel="noopener noreferrer">`;
          }

          // 用户名
          document.getElementById('profile-username').textContent =
            user.user_metadata?.username || user.email?.split('@')[0] || '行者';
          document.getElementById('profile-email').textContent = user.email || '';

          // 获取远端数据
          const remote = await fetchKnocksFromProfile();
          const remoteKnocks = remote?.total_knocks || 0;
          document.getElementById('profile-knocks').textContent = remoteKnocks.toLocaleString('zh-CN');

          // 合并数据
          if (typeof mergeRemoteKnocks === 'function') {
            await mergeRemoteKnocks(remoteKnocks);
          }
          document.getElementById('profile-local-knocks').textContent =
            getKnockCount().toLocaleString('zh-CN');
        }
      } catch (e) {
        // 离线模式
        console.log('离线模式');
      }
    });

    async function handleGitHubLogin() {
      try {
        await signInWithGitHub();
      } catch (e) {
        showToast('GitHub 登录失败：' + e.message);
      }
    }
  </script>
</body>
</html>
