<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="般若阁 - 佛教文化学习与修行辅助工具">
  <title>般若阁 - 木鱼</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 顶部导航 -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">般若阁</a>
      <div class="header-actions">
        <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">🌙</button>
        <button class="icon-btn" id="btn-login" title="登录" aria-label="登录" onclick="showAuthModal('login')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <div id="user-info" style="display:none;align-items:center;gap:8px;">
          <span id="username-display" style="font-size:0.85rem;color:var(--text-secondary)"></span>
          <button class="btn btn-ghost" onclick="handleLogout()" style="font-size:0.75rem;padding:4px 8px;">退出</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="main">
    <h1 class="page-title">般若阁</h1>
    <p class="page-subtitle">以清净心，修般若智</p>

    <!-- 木鱼区域 -->
    <section class="wooden-fish-section">
      <div class="wooden-fish-container" id="wooden-fish-container">
        <!-- 木鱼 SVG -->
        <svg class="wooden-fish-svg" id="wooden-fish" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- 鱼身主体 -->
          <defs>
            <radialGradient id="bodyGrad" cx="40%" cy="35%" r="55%">
              <stop offset="0%" stop-color="#d4a96a"/>
              <stop offset="40%" stop-color="#b88040"/>
              <stop offset="80%" stop-color="#8b5e30"/>
              <stop offset="100%" stop-color="#6b3a20"/>
            </radialGradient>
            <radialGradient id="bellyGrad" cx="45%" cy="45%" r="50%">
              <stop offset="0%" stop-color="#e8c880"/>
              <stop offset="100%" stop-color="#c09050"/>
            </radialGradient>
            <radialGradient id="eyeGrad" cx="35%" cy="35%" r="50%">
              <stop offset="0%" stop-color="#fff"/>
              <stop offset="100%" stop-color="#2a1508"/>
            </radialGradient>
            <filter id="woodShadow">
              <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3a1a08" flood-opacity="0.4"/>
            </filter>
          </defs>

          <!-- 底座/柄 -->
          <ellipse cx="100" cy="170" rx="50" ry="10" fill="#7a4a28" opacity="0.6"/>
          <rect x="88" y="150" width="24" height="25" rx="6" fill="#9a6a38" transform="rotate(-5, 100, 150)"/>

          <!-- 鱼身投影 -->
          <ellipse cx="105" cy="115" rx="62" ry="45" fill="#3a1a08" opacity="0.15" transform="translate(3, 5)"/>

          <!-- 鱼身 -->
          <ellipse cx="100" cy="108" rx="62" ry="42" fill="url(#bodyGrad)" filter="url(#woodShadow)"/>

          <!-- 鱼腹（较浅色区域） -->
          <ellipse cx="95" cy="115" rx="40" ry="25" fill="url(#bellyGrad)" opacity="0.4"/>

          <!-- 鳞片纹理 -->
          <g opacity="0.15" fill="none" stroke="#2a1508" stroke-width="0.8">
            <path d="M60,95 Q75,80 90,95"/>
            <path d="M70,105 Q85,90 100,105"/>
            <path d="M80,115 Q95,100 110,115"/>
            <path d="M70,115 Q85,100 100,115"/>
            <path d="M60,105 Q75,90 90,105"/>
            <path d="M110,95 Q125,80 140,95"/>
            <path d="M100,105 Q115,90 130,105"/>
            <path d="M90,115 Q105,100 120,115"/>
            <path d="M110,110 Q125,95 140,110"/>
            <path d="M120,102 Q132,90 145,102"/>
          </g>

          <!-- 鱼嘴/缝 -->
          <path d="M44,100 Q52,96 58,100" fill="none" stroke="#4a2010" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M46,106 Q52,102 58,106" fill="none" stroke="#4a2010" stroke-width="2" stroke-linecap="round"/>

          <!-- 鱼眼 -->
          <circle cx="62" cy="92" r="7" fill="url(#eyeGrad)"/>
          <circle cx="63" cy="91" r="2.5" fill="#fff" opacity="0.7"/>

          <!-- 鱼鳍（简化） -->
          <path d="M80,68 Q95,55 110,65" fill="#9a6030" stroke="#7a4a20" stroke-width="1" opacity="0.6"/>

          <!-- 敲击点（中央） -->
          <circle cx="105" cy="112" r="18" fill="none" stroke="#4a2010" stroke-width="1" opacity="0.08"/>
        </svg>
      </div>

      <!-- 计数器 -->
      <div class="knock-counter">
        <div class="knock-count" id="knock-count">0</div>
        <div class="knock-label">累计功德</div>
        <div class="knock-tip">点击木鱼，静心修福</div>
      </div>
    </section>

    <!-- 网站声明 -->
    <div class="disclaimer">
      本网站仅为佛教文化学习与修行辅助工具，不涉及任何商业行为。<br>
      佛经内容来源于乾隆大藏经等公共版权版本。
    </div>
  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <a href="index.html" class="active">
      <span class="nav-icon">🐟</span>木鱼
    </a>
    <a href="scriptures.html">
      <span class="nav-icon">📖</span>佛经
    </a>
    <a href="profile.html">
      <span class="nav-icon">👤</span>我的
    </a>
  </nav>

  <!-- 脚本 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/wooden-fish.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initWoodenFish();
    });
  </script>
</body>
</html>
